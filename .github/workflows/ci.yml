name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: npm run fonts
      - run: npm run build
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium webkit --with-deps
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: npm run test:sfx-lettering-browser
      - run: npm run test:sfx-selection
      - run: npm run test:sfx-stroke
      - run: npm run test:sfx-outline
      - run: npm run test:sfx-template
      - run: npm run test:sfx-render
      - run: npm run test:sfx-export
      - run: npm run test:sfx-touch
      - run: npm run test:project-open
      - run: npm run test:project-tabs
      - run: npm run test:project-history
      - run: npm run test:bulk
      - run: npm run test:mask-render
      - run: npm run test:mask-order
      - run: npm run test:browser
      - run: npm run test:mask-storage
      - run: npm run test:sam3-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serifu-regression
          path: |
            artifacts/*.png
            artifacts/*results.json
            artifacts/sfx-validation.json
          if-no-files-found: ignore
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.7
      - run: uv sync --locked
        working-directory: backend
      - run: uv run --locked pytest -m 'not gpu' -q
        working-directory: backend
