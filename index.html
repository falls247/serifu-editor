<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serifu — 画像とセリフを、続けて編集。</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="./">Serifu<span>画像に、声を。</span></a>
    <div class="header-actions">
      <button id="open">フォルダを開く</button>
      <button id="files">画像を追加</button>
      <button id="save" class="primary">一括保存 ↗</button>
    </div>
  </header>
  <div class="collection-bar">
    <div class="collection-info"><strong id="count">0 枚</strong><span id="progress">画像ごとに編集内容を保持</span></div>
    <nav aria-label="画像間の移動"><button id="previous" title="前の画像">←</button><select id="jump" aria-label="編集する画像"></select><button id="next" title="次の画像">→</button></nav>
    <div class="project-actions"><button id="projectLoad">編集データを読込</button><button id="projectSave">編集データを保存</button></div>
  </div>
  <div class="settings-bar">
    <div class="preset-group"><label>セリフの既定<select id="defaultDialogue" aria-label="セリフの既定プリセット"></select></label><button data-delete-preset="dialogue" title="この既定プリセットを削除">×</button></div>
    <div class="preset-group"><label>効果音の既定<select id="defaultSfx" aria-label="効果音の既定プリセット"></select></label><button data-delete-preset="sfx" title="この既定プリセットを削除">×</button></div>
    <button id="savePreset">選択中の設定を記憶</button>
    <div class="draft-controls"><button id="temporarySave">一時保存</button><label class="autosave-toggle"><input id="autosaveEnabled" type="checkbox" checked>自動保存</label><label class="interval-label"><input id="autosaveMinutes" type="number" min="0.1" max="1440" step="0.1" value="2" aria-label="自動保存の周期（分）">分ごと</label><span id="draftStatus" role="status">まだ一時保存なし</span></div>
  </div>
  <div id="draftNotice" class="draft-notice" hidden><span id="draftSummary"></span><button id="restoreDraft">保存した編集を復元</button><button id="clearDraft">一時保存を消去</button></div>
  <main>
    <div class="column-headings" aria-hidden="true"><span><b>01</b> 元画像</span><span><b>02</b> セリフ・効果音</span><span><b>03</b> プレビュー・位置調整</span></div>
    <section id="empty" class="empty">
      <div class="empty-symbol">Aa<span>✦</span></div>
      <p class="eyebrow">IMAGE → WORDS → STORY</p>
      <h1>何枚でも、物語をつなごう。</h1>
      <p>元画像を見ながらセリフを書いて、右のプレビューで位置を調整。<br>次の画像も、そのまま下へスクロール。</p>
      <div class="speaker-legend"><span class="male-dot"></span>男性：黒文字<span class="female-dot"></span>女性：ピンク文字<span class="outline-dot"></span>白い縁取り</div>
      <button id="demo">3枚のサンプルで試す ↗</button>
    </section>
    <div id="deck"></div>
  </main>
  <footer><span id="status" role="status" aria-live="polite">画像の外部送信なし · ブラウザ内で編集</span><span class="shortcut-hint">ドラッグ：移動／角：サイズ／丸：回転　矢印：1px　Shift：10px</span></footer>
  <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" multiple hidden>
  <input id="folderInput" type="file" accept="image/*" webkitdirectory multiple hidden>
  <input id="projectInput" type="file" accept="application/json,.json" hidden>

  <template id="pageTemplate">
    <article class="image-row">
      <div class="row-header">
        <div><span class="page-number"></span><strong class="page-name"></strong><span class="dimensions"></span></div>
        <button data-action="complete" class="complete-button">編集完了・次へ ↓</button>
      </div>
      <div class="row-columns">
        <section class="original-pane" aria-label="元画像">
          <div class="original-frame"><img class="original" alt=""></div>
          <div class="original-actions"><button data-action="remove">一覧から外す</button><button data-action="delete" class="danger">元画像を削除</button></div>
          <p class="source-note"></p>
        </section>
        <section class="dialogue-pane" aria-label="セリフと効果音の編集">
          <div class="add-actions"><button data-action="add-male"><span class="male-dot"></span>＋ 男性</button><button data-action="add-female"><span class="female-dot"></span>＋ 女性</button><button data-action="add-sfx">✦ 効果音</button></div>
          <div class="layer-cards"></div>
          <p class="no-layers">セリフか効果音を追加して、<br>この画像の物語を書こう。</p>
        </section>
        <section class="preview-pane" aria-label="編集結果と位置調整">
          <div class="preview-toolbar"><span class="preview-label">LIVE PREVIEW</span><div><button data-action="undo" title="この画像の編集を戻す">↶ 戻す</button><button data-action="redo" title="この画像の編集をやり直す">↷</button></div></div>
          <div class="preview-frame"><canvas class="preview" aria-label="文字をドラッグして位置調整"></canvas></div>
          <p class="preview-hint">文字をドラッグで移動。右下の角でサイズ調整、上の丸で回転。</p>
          <fieldset class="position-controls"><legend class="selected-name">文字を選択して位置調整</legend><div class="control-grid">
            <label>X<input data-field="x" type="number" step="1"></label><label>Y<input data-field="y" type="number" step="1"></label>
            <label>文字サイズ<input data-field="size" type="number" min="8" max="500"></label><label>回転 °<input data-field="rotation" type="number" min="-180" max="180"></label>
            <label>配置幅<input data-field="w" type="number" min="30" max="30000"></label><label>配置高さ<input data-field="h" type="number" min="30" max="30000"></label>
            <label>白い縁の太さ<input data-field="outline" type="number" min="1" max="80"></label><label>文字方向<select data-field="vertical"><option value="true">縦書き</option><option value="false">横書き</option></select></label>
            <label>書体<select data-field="font" aria-label="文字の書体"></select></label>
          </div><p class="font-status" role="status" hidden></p><div class="layer-actions"><button data-action="backward">背面へ</button><button data-action="forward">前面へ</button><button data-action="center">中央に配置</button></div></fieldset>
        </section>
      </div>
    </article>
  </template>
  <script type="module" src="app.js"></script>
</body>
</html>
