<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Serifu — 画像に、声を。</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">Serifu<span>画像に、声を。</span></div><div class="actions"><button id="open">フォルダを開く</button><button id="files">画像を追加</button><button id="save" class="primary">一括保存 ↗</button></div></header>
<main><aside class="library"><div class="section">IMAGES <span id="count">0 枚</span></div><div id="images"></div><div class="library-bottom"><button id="remove">一覧から外す</button><button id="delete" class="danger">元画像を削除</button><p>元画像の削除は確認後に実行。<br>編集による元画像の上書きなし。</p></div></aside>
<section class="workspace"><div class="toolbar"><div><button id="bubble">＋ 吹き出し</button><button id="sfx">＋ 効果音</button></div><div><button id="undo">↶ 戻す</button><button id="redo">↷ やり直す</button></div></div><div id="stage"><div id="empty"><div class="empty-icon">あ</div><h1>一枚に、物語を。</h1><p>フォルダを開いて、吹き出しや効果音を追加。<br>文字をつかんで、好きな場所へ。</p><button id="demo">サンプルで試す</button></div><canvas id="canvas" hidden aria-label="画像編集プレビュー"></canvas></div><footer><span id="filename">画像を選択</span><span>ドラッグで移動 · 矢印キーで微調整</span></footer></section>
<aside class="inspector"><div class="section">LAYERS <span>文字・吹き出し</span></div><div id="layers"></div><div id="properties" hidden><label>テキスト<textarea id="text" rows="3"></textarea></label><div class="grid"><label>種類<select id="kind"><option value="bubble">吹き出し</option><option value="sfx">効果音</option></select></label><label>形<select id="shape"><option value="ellipse">楕円</option><option value="rect">角丸</option></select></label></div><div class="grid"><label>X 座標<input id="x" type="number"></label><label>Y 座標<input id="y" type="number"></label><label>幅<input id="w" type="number" min="30"></label><label>高さ<input id="h" type="number" min="30"></label><label>文字サイズ<input id="size" type="number" min="8" max="500"></label><label>回転 °<input id="rotation" type="number" min="-180" max="180"></label></div><label>文字方向<select id="vertical"><option value="false">横書き</option><option value="true">縦書き（右から左）</option></select></label><div class="grid"><label>文字色<input id="color" type="color"></label><label>背景・縁色<input id="fill" type="color"></label><label>しっぽ X<input id="tailX" type="number"></label><label>しっぽ Y<input id="tailY" type="number"></label></div><p class="hint">座標・サイズは元画像のピクセル単位。しっぽは吹き出し中心からの相対位置。</p><div class="grid"><button id="duplicate">複製</button><button id="dropLayer" class="danger">文字を削除</button><button id="backward">背面へ</button><button id="forward">前面へ</button></div><label>セリフを入れ替え<select id="swapTarget"></select></label><button id="swap">選択した文字と交換</button></div><div class="project"><button id="projectSave">編集データを保存</button><button id="projectLoad">編集データを読込</button><p class="hint">編集データには画像も含む。再読込後も文字・位置を修正可能。</p></div></aside></main>
<div id="status" role="status" aria-live="polite">ローカル編集 · 画像の外部送信なし</div><input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" multiple hidden><input id="projectInput" type="file" accept="application/json,.json" hidden><script type="module" src="app.js"></script></body></html>
