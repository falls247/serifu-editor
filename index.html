<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serifu — 画像とセリフを、続けて編集。</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="./">Serifu<span>画像に、声を。</span></a>
    <div class="header-actions">
      <button id="open">フォルダを開く</button>
      <button id="files">画像を追加</button>
      <button id="save" class="primary">一括保存 ↗</button>
      <button id="saveEdited" class="primary" title="台詞・効果音・吹き出し・キャプションを編集した画像だけ新しいフォルダまたはZIPへ保存">編集済み画像一括保存</button>
    </div>
  </header>
  <div class="collection-bar">
    <div class="collection-info"><strong id="count">0 枚</strong><span id="progress">画像ごとに編集内容を保持</span></div>
    <nav aria-label="画像間の移動"><button id="previous" title="前の画像">←</button><select id="jump" aria-label="編集する画像"></select><button id="next" title="次の画像">→</button></nav>
    <div class="project-actions"><button id="projectLoad">編集データを読込</button><label>保存形式<select id="projectFormat" aria-label="編集データ形式"><option value="serifu" selected>高速形式 (.serifu)</option><option value="json">従来形式 (.json)</option></select></label><button id="projectSave">編集データを保存</button></div>
  </div>
  <div class="settings-bar">
    <div class="text-export-controls" role="group" aria-label="全ページのテキスト出力">
      <label>テキスト出力対象<select id="textTarget"><option value="female" selected>女性の台詞</option><option value="male">男性の台詞</option><option value="dialogue">すべての台詞</option><option value="caption">キャプション</option><option value="sfx">効果音</option><option value="all">すべての本文</option></select></label>
      <button id="textSave" title="全ページを現在のページ順に出力。台詞1件ごとに「」で囲んで改行。">テキストを保存</button>
    </div>
    <div class="preset-group"><label>セリフの既定<select id="defaultDialogue" aria-label="セリフの既定プリセット"></select></label><button data-delete-preset="dialogue" title="この既定プリセットを削除">×</button></div>
    <div class="preset-group"><label>効果音の既定<select id="defaultSfx" aria-label="効果音の既定プリセット"></select></label><button data-delete-preset="sfx" title="この既定プリセットを削除">×</button></div>
    <div class="preset-group"><label>吹き出しの既定<select id="defaultBalloon" aria-label="吹き出しの既定プリセット"></select></label><button data-delete-preset="balloon" title="この既定プリセットを削除">×</button></div>
    <div class="preset-group"><label>キャプションの既定<select id="defaultCaption" aria-label="キャプションの既定プリセット"></select></label><button data-delete-preset="caption" title="この既定プリセットを削除">×</button></div>
    <button id="savePreset">選択中の設定を記憶</button>
    <div class="draft-controls"><button id="temporarySave">一時保存</button><label class="autosave-toggle"><input id="autosaveEnabled" type="checkbox" checked>自動保存</label><label class="interval-label"><input id="autosaveMinutes" type="number" min="0.1" max="1440" step="0.1" value="2" aria-label="自動保存の周期（分）">分ごと</label><span id="draftStatus" role="status">まだ一時保存なし</span></div>
  </div>
  <div id="draftNotice" class="draft-notice" hidden><span id="draftSummary"></span><button id="restoreDraft">保存した編集を復元</button><button id="clearDraft">一時保存を消去</button></div>
  <div class="view-bar">
    <button id="toggleThumbnails" aria-expanded="true" aria-controls="thumbnailSidebar">サムネイルを非表示</button>
    <label>表示件数<select id="pageSize"><option value="50" selected>50件ずつ</option><option value="100">100件ずつ</option><option value="all">全表示</option></select></label>
    <nav aria-label="表示範囲の切替"><button id="previousBatch">前の範囲</button><span id="viewRange" role="status">0 / 0枚</span><button id="nextBatch">次の範囲</button></nav>
  </div>
  <section id="bulkPanel" class="bulk-panel" aria-label="一括処理の進捗" hidden>
    <strong id="bulkTitle" role="status" aria-live="polite"></strong>
    <span id="bulkStage"></span><progress id="bulkProgress" aria-label="現在の段階の進捗"></progress>
    <span id="bulkCounts"></span><span id="bulkName" class="bulk-name"></span><span id="bulkElapsed"></span>
    <button id="bulkCancel">中断</button>
  </section>
  <div id="workspace" class="workspace">
    <aside id="thumbnailSidebar" class="thumbnail-sidebar" aria-label="ページのサムネイル一覧">
      <div class="thumbnail-heading"><strong>ページ一覧</strong><span id="thumbnailProgress"></span></div>
      <label class="thumbnail-zoom">サムネイル倍率 <output id="thumbnailScaleValue">100%</output><input id="thumbnailScale" type="range" min="50" max="200" step="10" value="100"></label>
      <p class="thumbnail-legend"><span>未編集</span><span class="edited">編集済み</span><span class="done">✓ 確認済み</span></p>
      <div id="thumbnailList" class="thumbnail-list"></div>
    </aside>
  <main>
    <div class="column-headings" aria-hidden="true"><span><b>01</b> 元画像</span><span><b>02</b> セリフ・効果音</span><span><b>03</b> プレビュー・位置調整</span></div>
    <section id="empty" class="empty">
      <div class="empty-symbol">Aa<span>✦</span></div>
      <p class="eyebrow">IMAGE → WORDS → STORY</p>
      <h1>何枚でも、物語をつなごう。</h1>
      <p>元画像を見ながらセリフを書いて、右のプレビューで位置を調整。<br>次の画像も、そのまま下へスクロール。</p>
      <div class="speaker-legend"><span class="male-dot"></span>男性：黒文字<span class="female-dot"></span>女性：ピンク文字<span class="outline-dot"></span>白い縁取り</div>
      <button id="demo">3枚のサンプルで試す ↗</button>
    </section>
    <div id="deck"></div>
  </main>
  </div>
  <footer><span id="status" role="status" aria-live="polite">画像の外部送信なし · ブラウザ内で編集</span><span class="shortcut-hint">ドラッグ：移動／角：サイズ／丸：回転　矢印：1px　Shift：10px</span></footer>
  <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" multiple hidden>
  <input id="folderInput" type="file" accept="image/*" webkitdirectory multiple hidden>
  <input id="projectInput" type="file" accept="application/json,.json,.serifu" hidden>

  <template id="pageTemplate">
    <article class="image-row">
      <div class="row-header">
        <div><span class="page-number"></span><strong class="page-name"></strong><span class="dimensions"></span><span class="edited-badge" hidden>編集済み</span></div>
        <div class="page-actions" role="group" aria-label="ページ順の変更と編集完了">
          <button data-action="move-up" title="このページを1つ前へ移動">ページ移動↑</button>
          <button data-action="move-down" title="このページを1つ後へ移動">ページ移動↓</button>
          <button data-action="complete" class="complete-button">編集完了・次へ ↓</button>
        </div>
      </div>
      <div class="row-columns">
        <section class="original-pane" aria-label="元画像">
          <div class="original-frame"><img class="original" alt=""></div>
          <div class="original-actions"><button data-action="remove">一覧から外す</button><button data-action="delete" class="danger">元画像を削除</button></div>
          <p class="source-note"></p>
        </section>
        <section class="dialogue-pane" aria-label="セリフと効果音の編集">
          <div class="add-actions"><button data-action="add-male"><span class="male-dot"></span>＋ 男性</button><button data-action="add-female"><span class="female-dot"></span>＋ 女性</button><button data-action="add-sfx">✦ 効果音</button><button data-action="add-balloon">○ 吹き出し</button><button data-action="add-caption">▭ キャプション</button></div>
          <div class="batch-layer-actions" role="group" aria-label="この画像の台詞・効果音・吹き出し・キャプションを一括コピー・カット・ペースト">
            <button data-action="copy-all" title="この画像の台詞・効果音・吹き出し・キャプションを、書式と位置も含めてすべてコピー">文字を一括コピー</button>
            <button data-action="cut-all" title="この画像の台詞・効果音・吹き出し・キャプションをすべてカット。「戻す」でまとめて復元。">文字を一括カット</button>
            <button data-action="paste-all" title="コピー・カットした台詞・効果音・吹き出し・キャプションをこの画像に追加。位置は画像サイズに合わせる。" disabled>文字を一括ペースト</button>
          </div>
          <p class="batch-copy-hint">台詞・効果音・吹き出し・キャプションをまとめて別の画像に追加。貼付け一回分は「戻す」で取り消せる。</p>
          <div class="layer-cards"></div>
          <p class="no-layers">セリフ・効果音・吹き出しを追加して、<br>この画像の物語を書こう。</p>
        </section>
        <section class="preview-pane" aria-label="編集結果と位置調整">
          <div class="preview-toolbar"><span class="preview-label">LIVE PREVIEW</span><div class="preview-actions"><button data-action="save-image" title="この画像だけ元解像度のPNGで保存">画像を保存</button><button data-action="undo" title="この画像の編集を戻す">↶ 戻す</button><button data-action="redo" title="この画像の編集をやり直す">↷</button></div></div>
          <div class="preview-frame"><canvas class="preview" aria-label="文字をドラッグして位置調整"></canvas></div>
          <p class="preview-hint">文字をドラッグで移動。右下の角でサイズ調整、上の丸で回転。プレビュー上で Delete：選択オブジェクトを削除、Ctrl／⌘＋C／V：コピー・貼付け。</p>
          <fieldset class="position-controls"><legend class="selected-name">文字を選択して位置調整</legend><div class="control-grid">
            <label>X<input data-field="x" type="number" step="1"></label><label>Y<input data-field="y" type="number" step="1"></label>
            <label data-text-control>文字サイズ<input data-field="size" type="number" min="8" max="500"></label><label>回転 °<input data-field="rotation" type="number" min="-180" max="180"></label>
            <label data-text-control data-ink-control>文字の太さ（px）<input data-field="thickness" type="number" min="-10" max="30" step="0.5" title="0は書体の標準。正の値で太く、負の値で細く。白い縁とは別に調整。"></label>
            <label>配置幅<input data-field="w" type="number" min="30" max="30000"></label><label>配置高さ<input data-field="h" type="number" min="30" max="30000"></label>
            <label data-text-control data-ink-control>白い縁の太さ<input data-field="outline" type="number" min="1" max="80"></label><label data-text-control>文字方向<select data-field="vertical"><option value="true">縦書き</option><option value="false">横書き</option></select></label>
            <label data-text-control>書体<select data-field="font" aria-label="文字の書体"></select></label>
          </div><div class="balloon-style-controls control-grid" hidden>
            <label class="balloon-shape-control">吹き出し形状<select data-field="shape"><option value="ellipse">楕円</option><option value="distorted-rect">歪み長方形</option></select></label>
            <label class="balloon-distortion-control" hidden>歪み度（<output>50%</output>）<input data-field="distortion" type="range" min="0" max="100" step="1"></label>
            <label>枠線の色<input data-field="borderColor" type="color"></label><label>枠線の太さ（px）<input data-field="borderWidth" type="number" min="0" max="80" step="0.5"></label>
          </div><div class="caption-controls" hidden><div class="control-grid">
            <label>キャプションの文字色<input data-field="textColor" type="color"></label><label>内側の余白（px）<input data-field="padding" type="number" min="0" max="2000" step="1"></label>
            <label>文字の輪郭色<input data-field="textOutlineColor" type="color"></label><label>文字の輪郭の太さ（px）<input data-field="textOutlineWidth" type="number" min="0" max="80" step="0.5" title="0で輪郭なし"></label>
            <label>左右の揃え方<select data-field="alignX"><option value="left">左</option><option value="center">中央</option><option value="right">右</option></select></label>
            <label>上下の揃え方<select data-field="alignY"><option value="top">上</option><option value="center">中央</option><option value="bottom">下</option></select></label>
          </div><label class="tail-toggle"><input data-field="autoFit" type="checkbox">文字サイズをボックスに合わせる</label><p class="caption-fit-status effect-note"></p>
          </div><div class="balloon-tail-controls control-grid" hidden>
            <label>テール先端X（中心からpx）<input data-field="tailX" type="number" min="-30000" max="30000" step="1"></label><label>テール先端Y（中心からpx）<input data-field="tailY" type="number" min="-30000" max="30000" step="1"></label>
            <label>テール付根の角度 °<input data-field="tailAngle" type="number" min="-180" max="180" step="1"></label><label>テール付根の幅（px）<input data-field="tailWidth" type="number" min="1" max="1000" step="1"></label>
          </div><p class="balloon-position-note effect-note" hidden>形状は楕円または歪み長方形。歪み度は0〜100%で調整。テールありなら水色の点で先端を移動。</p><p class="effect-note" data-text-control data-ink-control>太さ：負の値で細く／0で書体の標準／正の値で太く。</p><p class="font-note effect-note" hidden></p><p class="font-status" role="status" hidden></p><div class="layer-actions"><button data-action="backward">背面へ</button><button data-action="forward">前面へ</button><button data-action="center">中央に配置</button></div></fieldset>
        </section>
      </div>
    </article>
  </template>
  <script type="module" src="app.js"></script>
</body>
</html>
