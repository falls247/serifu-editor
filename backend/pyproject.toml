[project]
name = "serifu-editor-sam3-backend"
version = "0.1.0"
description = "Local SAM3 inference API for serifu-editor"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<2",
  "pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
gpu = [
  "einops>=0.8,<1",
  "psutil>=7,<8",
  "pycocotools>=2.0.11,<3",
  "sam3",
  # SAM3 imports pkg_resources without declaring setuptools at runtime.
  "setuptools>=80,<81",
  "torch==2.10.0",
  "torchvision==0.25.0",
]

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "pytest>=8.3,<9",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
sam3 = { git = "https://github.com/facebookresearch/sam3", rev = "0570b3a5be9c4e694f23d85232fb55f4a6f1f7fc" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = ["gpu: requires pinned SAM3 model weights and a CUDA GPU"]
